<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>FlocoCoin ❄️ - Pink Paradise</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at top, #0b2b4a 0%, #061a2e 60%, #030d18 100%);
    color: #eaf6ff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(127,199,255,0.3);
    border-radius: 24px;
    padding: 40px 30px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 40px rgba(30,120,200,0.25);
    backdrop-filter: blur(6px);
  }
  .logo {
    width: 140px;
    height: 140px;
    margin: 0 auto 20px;
    display: block;
    filter: drop-shadow(0 0 20px rgba(127,199,255,0.5));
  }
  h1 {
    margin: 0 0 4px;
    font-size: 28px;
    background: linear-gradient(90deg, #eaf6ff, #7fc7ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    color: #9fc9e8;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .balance-box {
    background: rgba(0,0,0,0.25);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 24px;
    font-size: 14px;
    color: #cfe9ff;
  }
  .balance-box strong {
    display: block;
    font-size: 22px;
    color: #ffffff;
    margin-top: 4px;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(90deg, #1a6fb5, #4fa8e8);
    color: white;
  }
  .btn-secondary {
    background: transparent;
    border: 1px solid rgba(127,199,255,0.4);
    color: #cfe9ff;
  }
  #status {
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
    color: #a8e6a1;
  }
  #status.error { color: #ff9e9e; }
  .addr {
    font-size: 11px;
    color: #6f9bc2;
    word-break: break-all;
    margin-top: 20px;
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="card">
  <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="g" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#eaf6ff"/>
        <stop offset="55%" stop-color="#7fc7ff"/>
        <stop offset="100%" stop-color="#1a6fb5"/>
      </radialGradient>
    </defs>
    <circle cx="256" cy="256" r="230" fill="url(#g)"/>
    <circle cx="256" cy="256" r="230" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.6"/>
    <g stroke="#ffffff" stroke-width="14" stroke-linecap="round">
      <g id="branch">
        <line x1="256" y1="256" x2="256" y2="110"/>
        <line x1="256" y1="150" x2="228" y2="178"/>
        <line x1="256" y1="150" x2="284" y2="178"/>
        <line x1="256" y1="190" x2="232" y2="214"/>
        <line x1="256" y1="190" x2="280" y2="214"/>
      </g>
      <use href="#branch" transform="rotate(60 256 256)"/>
      <use href="#branch" transform="rotate(120 256 256)"/>
      <use href="#branch" transform="rotate(180 256 256)"/>
      <use href="#branch" transform="rotate(240 256 256)"/>
      <use href="#branch" transform="rotate(300 256 256)"/>
    </g>
    <circle cx="256" cy="256" r="18" fill="#ffffff"/>
  </svg>

  <h1>FlocoCoin</h1>
  <div class="subtitle">❄️ Le token cadeau de Noël — Pink Paradise</div>

  <div class="balance-box">
    Ton solde FLOCO
    <strong id="balanceDisplay">— connecte ton wallet —</strong>
  </div>

  <button class="btn-primary" onclick="connectWallet()">🦊 Connecter MetaMask</button>
  <button class="btn-secondary" onclick="addToken()">➕ Ajouter FLOCO (avec logo) à MetaMask</button>

  <div id="status"></div>

  <div class="addr">
    Contrat FLOCO (Sepolia) :<br>
    0x39fC06295A13f8F371166a45c3D9840DaA92016F
  </div>
</div>

<script>
const TOKEN_ADDRESS = "0x39fC06295A13f8F371166a45c3D9840DaA92016F";
const TOKEN_SYMBOL = "FLOCO";
const TOKEN_DECIMALS = 18;
const TOKEN_IMAGE = window.location.origin + window.location.pathname.replace(/[^/]*$/, '') + "flococoin-logo-256.png";
const SEPOLIA_CHAIN_ID = "0xaa36a7";

const statusEl = document.getElementById('status');
const balanceEl = document.getElementById('balanceDisplay');

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = isError ? 'error' : '';
}

async function ensureSepolia() {
  const chainId = await window.ethereum.request({ method: 'eth_chainId' });
  if (chainId !== SEPOLIA_CHAIN_ID) {
    try {
      await window.ethereum.request({
        method: 'wallet_switchEthereumChain',
        params: [{ chainId: SEPOLIA_CHAIN_ID }],
      });
    } catch (e) {
      setStatus("Merci de passer sur le réseau Sepolia dans MetaMask.", true);
      throw e;
    }
  }
}

async function connectWallet() {
  if (!window.ethereum) {
    setStatus("MetaMask non détecté. Ouvre cette page depuis le navigateur MetaMask ou un navigateur avec l'extension.", true);
    return;
  }
  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    await ensureSepolia();
    setStatus("Connecté : " + accounts[0].slice(0,6) + "..." + accounts[0].slice(-4));
    await fetchBalance(accounts[0]);
  } catch (e) {
    setStatus("Connexion refusée ou erreur.", true);
  }
}

async function fetchBalance(address) {
  try {
    // balanceOf(address) selector: 0x70a08231
    const data = "0x70a08231" + address.slice(2).padStart(64, '0');
    const result = await window.ethereum.request({
      method: 'eth_call',
      params: [{ to: TOKEN_ADDRESS, data: data }, 'latest']
    });
    const raw = BigInt(result);
    const balance = Number(raw) / (10 ** TOKEN_DECIMALS);
    balanceEl.textContent = balance.toLocaleString('fr-FR') + " FLOCO";
  } catch (e) {
    balanceEl.textContent = "erreur de lecture";
  }
}

async function addToken() {
  if (!window.ethereum) {
    setStatus("MetaMask non détecté.", true);
    return;
  }
  try {
    await ensureSepolia();
    const wasAdded = await window.ethereum.request({
      method: 'wallet_watchAsset',
      params: {
        type: 'ERC20',
        options: {
          address: TOKEN_ADDRESS,
          symbol: TOKEN_SYMBOL,
          decimals: TOKEN_DECIMALS,
          image: TOKEN_IMAGE,
        },
      },
    });
    if (wasAdded) {
      setStatus("FLOCO ajouté avec le logo ❄️");
    } else {
      setStatus("Ajout annulé.", true);
    }
  } catch (e) {
    setStatus("Erreur : " + (e.message || e), true);
  }
}
</script>

</body>
</html>
